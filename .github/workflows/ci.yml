name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim:
          - v0.10.4
          - stable
    steps:
      - uses: actions/checkout@v7
      - name: Set up Neovim
        uses: thinca/action-setup-vim@v3
        with:
          vim_type: Neovim
          vim_version: ${{ matrix.neovim }}
      - run: nvim --version
      - run: make test

  format:
    name: StyLua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua plugin tests
