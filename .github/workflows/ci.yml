name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim:
          - v0.10.4
          - stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make ci-policy-check
      - name: Set up Neovim
        uses: thinca/action-setup-vim@12357e60838c113ae054e026eaaf94176c9ec769 # v3.0.3
        with:
          vim_type: Neovim
          vim_version: ${{ matrix.neovim }}
      - run: nvim --version
      - run: node --version && test "$(node -p 'Number(process.versions.node.split(".")[0])')" -ge 20
      - run: make test

  format:
    name: StyLua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make ci-policy-check
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua plugin tests scripts/coverage

  smoke:
    name: Published Pi baseline smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make ci-policy-check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Set up Neovim
        uses: thinca/action-setup-vim@12357e60838c113ae054e026eaaf94176c9ec769 # v3.0.3
        with:
          vim_type: Neovim
          vim_version: stable
      - run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@0.82.1
      - run: make smoke-baseline
